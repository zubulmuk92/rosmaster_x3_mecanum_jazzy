# Filtre Madgwick du X3 : /imu/data_raw (x3_base) -> /imu/data (orientation), sans magnétomètre.
imu_filter_madgwick:
    ros__parameters:
        fixed_frame: "base_link"
        use_mag: false
        publish_tf: false
        world_frame: "enu"
        orientation_stddev: 0.05
